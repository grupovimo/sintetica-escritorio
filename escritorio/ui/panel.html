<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sintética</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- Los íconos: dibujados, uno por cosa, del mismo trazo. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mandar" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mimo" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z" fill="currentColor"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  </svg>

  <header data-tauri-drag-region>
    <div class="fecha" data-tauri-drag-region>
      <span class="grabado" id="dia-semana"></span>
      <h1 id="dia-numero"></h1>
    </div>
    <div class="visor clima" id="clima" hidden>
      <span class="digitos" id="temp"></span>
      <span class="grabado" id="cielo"></span>
    </div>
  </header>

  <nav class="robots" id="robots" aria-label="A quién le hablás"></nav>

  <!-- Un selector y un solo visor: hoy o una de las listas. -->
  <section class="placa-naranja" aria-label="Hoy y listas">
    <div class="pestanas" id="pestanas" role="tablist"></div>
    <div class="canal" id="canal-hoy">
      <ul class="visor dia" id="dia"></ul>
      <div class="visor bienvenida" id="sin-sumar" hidden>
        <span class="grabado">Tu día, tus listas, tus robots</span>
        <button type="button" class="tecla naranja grande" id="p-entrar">Sumalo con Telegram</button>
        <form id="p-codigo" class="visor fila" hidden>
          <input id="p-codigo-texto" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Código">
        </form>
        <span class="grabado" id="p-paso"></span>
      </div>
      <p class="visor vacio grabado" id="nada-hoy" hidden>Nada más por hoy</p>
    </div>
    <div class="bandeja canal" id="bandeja" hidden>
      <ul id="items"></ul>
      <form id="form-item" class="visor fila">
        <input id="nuevo-item" maxlength="120" autocomplete="off" placeholder="Agregar">
        <button type="submit" class="tecla negra cuadrada chica" aria-label="Agregar"><svg><use href="#i-mas"/></svg></button>
      </form>
    </div>
  </section>

  <section class="charla" id="charla" aria-live="polite"></section>

  <form id="form" class="renglon">
    <div class="visor fila">
      <input id="frase" maxlength="200" autocomplete="off" placeholder="Decile algo">
    </div>
    <button type="submit" class="tecla naranja cuadrada" aria-label="Mandar"><svg><use href="#i-mandar"/></svg></button>
  </form>
  <script src="panel.js"></script>
</body>
</html>
