<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sintética</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="pantalla" id="pantalla">
    <canvas id="cara" width="320" height="172"></canvas>
    <p class="globo" id="globo" role="status" aria-live="polite"></p>
    <div class="sumar" id="sumar" hidden>
      <button type="button" id="entrar" title="Sumarlo a tu cuenta con Telegram">Sumar</button>
      <form id="form-codigo" hidden>
        <input id="codigo" inputmode="numeric" autocomplete="one-time-code" placeholder="código" maxlength="8">
      </form>
      <span id="paso"></span>
    </div>
    <div class="sumar" id="compra" hidden>
      <button type="button" id="comprar" title="La prueba terminó: comprarlo (pago único)">Comprar</button>
    </div>
    <nav class="botones">
      <button type="button" id="b-hablar" title="Hablarle (⌘⇧Espacio)" aria-label="Hablarle">
        <svg viewBox="0 0 24 24"><path d="M5 6.5h14a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-7L8 20v-3.5H5A1.5 1.5 0 0 1 3.5 15V8A1.5 1.5 0 0 1 5 6.5Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" id="b-esconder" title="Esconderla (vuelve desde la barra)" aria-label="Esconder">
        <svg viewBox="0 0 24 24"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </nav>
    <i class="punto" id="punto" title="Sin nube"></i>
  </main>
  <script src="cara.js"></script>
</body>
</html>
